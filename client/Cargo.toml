[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
clap = { version = "4.6.6", features = ["derive", "env"] }
dialoguer = "0.12.0"
dotenvy = "0.15.7"
futures-util = "0.3.34"
linfa = "0.8.1"
linfa-linear = "0.8.1"
ndarray = "0.16.1"
nusb = { version = "0.2.7", features = ["tokio"] }
pin-project-lite = "0.2.17"
postcard = { version = "1.1.3", default-features = false, features = [
    "use-std",
] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dependencies.protocol]
path = "../protocol"
features = ["std"]
