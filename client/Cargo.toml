[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
crc = "3.4.0"
derive_more = { version = "2.1.1", features = ["debug"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", features = ["sink"] }
pin-project-lite = "0.2.17"
postcard = { version = "1.1.3", default-features = false, features = [
    "use-std",
] }
serde = "1.0.229"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "time",
] }
tokio-serial = "5.5.0"
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dependencies.protocol]
path = "../protocol"
