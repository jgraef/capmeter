[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "firmware"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
embassy-stm32 = { version = "0.6.0", git = "https://github.com/embassy-rs/embassy.git", features = [
    "defmt",
    "stm32f401cc",
    "unstable-pac",
    "memory-x",
    "time-driver-tim4",
    "exti",
    "chrono",
] }
embassy-sync = { version = "0.8.0", git = "https://github.com/embassy-rs/embassy.git", features = [
    "defmt",
] }
embassy-executor = { version = "0.10.0", git = "https://github.com/embassy-rs/embassy.git", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.1", git = "https://github.com/embassy-rs/embassy.git", features = [
    "defmt",
    "defmt-timestamp-uptime-ms",
    "tick-hz-32_768",
] }
embassy-usb = { version = "0.6.0", git = "https://github.com/embassy-rs/embassy.git", features = [
    "defmt",
] }
embassy-futures = { version = "0.1.2", git = "https://github.com/embassy-rs/embassy.git" }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.0"
embedded-hal = "0.2.6"
embedded-io = { version = "0.7.1" }
embedded-io-async = { version = "0.7.0" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
futures-util = { version = "0.3.30", default-features = false }
heapless = { version = "0.9", default-features = false }
critical-section = "1.1"
postcard = { version = "1.1.3", default-features = false, features = [
    "use-defmt",
] }

[dependencies.protocol]
path = "../protocol"
features = ["defmt"]


[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
incremental = false
codegen-units = 1
debug = true
