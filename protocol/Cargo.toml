[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
defmt = { version = "1.1.1", optional = true, default-features = false }
serde = { version = "1.0.229", features = ["derive"], default-features = false }
thiserror = { version = "2.0.20", default-features = false }

[features]
defmt = ["dep:defmt"]
#thiserror = ["dep:thiserror"]
std = ["thiserror/std", "serde/std"]
